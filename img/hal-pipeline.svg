<rect x="610" y="190" width="160" height="64" rx="10" fill="#1f3b2f" stroke="#58c08a" stroke-width="2"/><text x="690" y="218" fill="#d4f5e4">Text to speech</text><text x="690" y="238" fill="#9fd9ba" font-size="13" font-weight="400">Piper, speaks early</text>
<rect x="320" y="190" width="160" height="64" rx="10" fill="#1f3b2f" stroke="#58c08a" stroke-width="2"/><text x="400" y="218" fill="#d4f5e4">Speaker</text><text x="400" y="238" fill="#9fb8cc" font-size="13" font-weight="400">replies as it thinks</text>
