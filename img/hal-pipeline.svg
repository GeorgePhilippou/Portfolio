<g stroke="#e0a458" stroke-width="2" fill="none"><path d="M190 82 H320"/><path d="M480 82 H610"/><path d="M690 114 V190"/><path d="M610 222 H480"/></g>
<rect x="30" y="190" width="160" height="64" rx="10" fill="#2f2440" stroke="#a98be0" stroke-width="2"/>
<text x="110" y="218" fill="#eadcff" font-size="15" font-weight="600" text-anchor="middle">OLED face</text><text x="110" y="238" fill="#c9b6f0" font-size="13" text-anchor="middle">idle · listening · thinking</text>
<path d="M190 222 H230" stroke="#a98be0" stroke-width="2" stroke-dasharray="5 4"/>
<g font-size="14" fill="#c8d6e2">
<text x="30" y="310" fill="#ffd9a0" font-size="16" font-weight="600">Runs on a Raspberry Pi 5</text>
<text x="30" y="340">· iPhone companion web app with push-to-talk and a live mirror of the OLED</text>
<text x="30" y="364">· Long-term memory per person, timers that survive restarts, local music</text>
<text x="30" y="388">· Thermal protection, crash isolation, automated tests and versioned backups</text></g>
