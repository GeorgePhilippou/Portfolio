<rect x="320" y="50" width="160" height="64" rx="10" fill="#20364a" stroke="#3f6a8c" stroke-width="2"/><text x="400" y="78" fill="#dbe9f5">Speech to text</text><text x="400" y="98" fill="#9fb8cc" font-size="13" font-weight="400">faster-whisper</text>
